<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>도로 관제</title>
<link rel="stylesheet" href="/static/common.css?v=3">
<style>
  body { display: flex; flex-direction: column; min-height: 100%; }

  /* ---------- 상단 */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(14, 17, 22, .92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; margin-right: auto; }
  .brand svg { color: var(--accent); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted);
          padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); white-space: nowrap; }
  .live .dot { width: 8px; height: 8px; }
  .live.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(47, 182, 124, .18); }
  .live.bad .dot { background: var(--danger); }
  .live.bad { color: #ff9a9d; }

  /* 메뉴 */
  .menu-wrap { position: relative; }
  .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px;
              background: var(--surface); border: 1px solid var(--border); cursor: pointer; padding: 0; }
  .icon-btn:hover { border-color: var(--muted); }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 200px; z-index: 30;
          background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
          box-shadow: 0 12px 32px rgba(0, 0, 0, .45); }
  .menu[hidden] { display: none; }
  .menu .who { padding: 8px 10px 10px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .menu .who strong { color: var(--text); font-size: 15px; display: block; }
  .menu a, .menu button { display: block; width: 100%; text-align: left; padding: 10px; border-radius: 8px;
          background: none; border: 0; color: var(--text); text-decoration: none; cursor: pointer; font-size: 15px; }
  .menu a:hover, .menu button:hover { background: var(--surface); }

  /* ---------- 공지 */
  #banners:empty { display: none; }
  #banners { display: grid; gap: 8px; padding: 12px 16px 0; }
  .banner { padding: 10px 14px; border-radius: 10px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; line-height: 1.45; }
  .banner strong { white-space: nowrap; }
  .banner.info { background: #12263f; color: #cfe2ff; border: 1px solid #1f3d63; }
  .banner.warn { background: #3a2a06; color: #ffe2a0; border: 1px solid #5c4410; }
  .banner.off  { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

  /* ---------- 카메라 목록 */
  main { flex: 1; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 16px; align-content: start; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .section-head h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

  #grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1100px) { #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    main { padding-left: 12px; padding-right: 12px; }
    #grid { gap: 10px; }
    #grid.one { grid-template-columns: 1fr; }
  }
  @media (min-width: 641px) { .seg { display: none; } }

  .cam {
    display: flex; flex-direction: column; padding: 0; text-align: left; cursor: zoom-in;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    transition: border-color .15s;
  }
  .cam:hover { border-color: #3a4456; }
  .cam:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cam .shot { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .25s; }
  .cam img.loaded { opacity: 1; }
  .cam .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .cam img.loaded + .wait { display: none; }
  .cam .info { display: flex; align-items: center; gap: 8px; padding: 9px 12px; min-width: 0; }
  .cam .txt { min-width: 0; flex: 1; }
  .cam .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cam .loc { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .age { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .age::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .age.late::before { background: var(--warn); }
  .age.off::before { background: var(--danger); }
  .age:empty { display: none; }
  @media (max-width: 640px) {
    #grid:not(.one) .cam .info { padding: 7px 9px; gap: 6px; }
    #grid:not(.one) .cam .name { font-size: 14px; }
    #grid:not(.one) .cam .loc { display: none; }
  }

  /* 연결 안 된 카메라: 작게 */
  #offline:empty, #offlineHead[hidden] { display: none; }
  #offline { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .off-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
             background: var(--surface); border: 1px dashed var(--border); color: var(--muted); font-size: 14px; }
  .off-row strong { color: var(--text); font-weight: 600; }
  .off-row .sub { margin-left: auto; font-size: 12px; white-space: nowrap; }

  .empty { padding: 60px 16px; text-align: center; color: var(--muted); }

  /* ---------- 크게 보기 */
  #ov { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 40; }
  #ov[hidden] { display: none; }
  .ov-top, .ov-bottom {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: rgba(14, 17, 22, .88); z-index: 2;
  }
  .ov-top { padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid #1d2330; }
  .ov-bottom { padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid #1d2330; min-height: 52px; }
  .ov-title { flex: 1; min-width: 0; text-align: center; }
  .ov-title strong { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-title span { font-size: 12px; color: var(--muted); }
  #ovCount { color: var(--muted); font-size: 13px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  #stage { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #ovImg { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
  .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
             background: rgba(14, 17, 22, .7); border: 1px solid #2b3240; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; z-index: 2; }
  .nav-btn:hover { background: rgba(31, 37, 48, .9); }
  #prev { left: 12px; } #next { right: 12px; }
  .zoom-ctl { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  #zoomLabel { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2; pointer-events: none;
          background: rgba(14, 17, 22, .8); color: #c9cfda; font-size: 13px; padding: 6px 12px; border-radius: 999px;
          white-space: nowrap; transition: opacity .4s; }
  .hint.gone { opacity: 0; }
  @media (pointer: coarse) {
    .nav-btn, #zIn, #zOut { display: none; }
  }

  #idle { position: fixed; inset: 0; background: rgba(0, 0, 0, .8); display: grid; place-items: center; z-index: 50; padding: 16px; }
  #idle[hidden] { display: none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11l4 3v4l-4 3H3z"/><circle cx="8.5" cy="12" r="2"/><path d="M18 11l3-2v6l-3-2"/></svg>
    도로 관제
  </div>
  <span class="live" id="live"><span class="dot"></span><span id="liveText">연결 중</span></span>
  <div class="menu-wrap">
    <button class="icon-btn" id="menuBtn" aria-label="메뉴" aria-haspopup="true" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <div class="who"><strong id="who">-</strong>로그인 중</div>
      <a href="/admin" id="adminLink" hidden>관리자 페이지</a>
      <a href="/change-password">비밀번호 변경</a>
      <button onclick="logout()">로그아웃</button>
    </div>
  </div>
</header>

<div id="banners" aria-live="polite"></div>

<main>
  <div class="section-head">
    <h2 id="summary">카메라</h2>
    <div class="seg" role="group" aria-label="보기 방식">
      <button data-cols="2" aria-pressed="true">2열</button>
      <button data-cols="1" aria-pressed="false">1열</button>
    </div>
  </div>
  <div id="grid"></div>
  <div class="section-head" id="offlineHead" hidden><h2 id="offlineTitle">연결 안 된 카메라</h2></div>
  <div id="offline"></div>
</main>

<div id="ov" hidden>
  <div class="ov-top">
    <button class="icon-btn" id="close" aria-label="닫기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="ov-title"><strong id="ovTitle"></strong><span id="ovLoc"></span></div>
    <span id="ovCount"></span>
  </div>
  <div id="stage">
    <img id="ovImg" alt="">
    <div class="hint" id="hint"></div>
    <button class="nav-btn" id="prev" aria-label="이전 카메라">‹</button>
    <button class="nav-btn" id="next" aria-label="다음 카메라">›</button>
  </div>
  <div class="ov-bottom">
    <span class="age" id="ovAge"></span>
    <div class="zoom-ctl">
      <button class="btn sm" id="zOut" aria-label="축소">－</button>
      <span id="zoomLabel">100%</span>
      <button class="btn sm" id="zIn" aria-label="확대">＋</button>
      <button class="btn sm" id="zReset" hidden>원래 크기</button>
    </div>
  </div>
</div>

<div id="idle" hidden>
  <div class="card" style="text-align:center;max-width:320px">
    <p style="margin-top:0">한동안 조작이 없어 갱신을 멈췄습니다.</p>
    <button class="btn primary" id="resume">계속 보기</button>
  </div>
</div>

<script src="/static/common.js?v=3"></script>
<script src="/static/viewer.js?v=5"></script>
</body>
</html>
