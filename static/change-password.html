<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 변경</title>
<link rel="stylesheet" href="/static/common.css?v=3">
</head>
<body>
<main class="center-page">
  <form class="card" id="form">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11l4 3v4l-4 3H3z"/><circle cx="8.5" cy="12" r="2"/><path d="M18 11l3-2v6l-3-2"/></svg></div>
    <h1>비밀번호 변경</h1>
    <p class="muted" style="margin:0">계속하려면 새 비밀번호를 정하세요. 8자 이상, 사번과 달라야 합니다.</p>
    <div class="form-row">
      <label for="o">현재 비밀번호</label>
      <input class="input" id="o" type="password" autocomplete="current-password" required autofocus>
    </div>
    <div class="form-row">
      <label for="n">새 비밀번호</label>
      <input class="input" id="n" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="form-row">
      <label for="c">새 비밀번호 확인</label>
      <input class="input" id="c" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <p class="error" id="err"></p>
    <button class="btn primary" style="width:100%" id="go">변경</button>
    <p style="margin:12px 0 0;font-size:13px"><a href="#" onclick="logout();return false">로그아웃</a></p>
  </form>
</main>
<script src="/static/common.js?v=3"></script>
<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  const n = document.getElementById('n').value;
  if (n !== document.getElementById('c').value) { err.textContent = '새 비밀번호가 서로 다릅니다'; return; }
  err.textContent = ''; go.disabled = true;
  try {
    await api('/api/change-password', { method: 'POST', body: { old: document.getElementById('o').value, new: n } });
    location.href = '/';
  } catch (ex) {
    err.textContent = ex.message; go.disabled = false;
  }
});
</script>
</body>
</html>
